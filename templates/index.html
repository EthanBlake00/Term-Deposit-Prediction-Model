<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Model Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            height: 100vh;
            background-color: #f4f7fc;
            font-family: 'Arial', sans-serif;
        }
        .container {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form-container {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }
        h2 {
            font-weight: 600;
            color: #333;
        }
        .form-label {
            font-weight: 500;
            color: #555;
        }
        .btn-primary {
            background-color: #4caf50;
            border-color: #4caf50;
        }
        .btn-primary:hover {
            background-color: #45a049;
            border-color: #45a049;
        }
        .optional-section h3 small {
            color: #6c757d;
        }
        .form-select, .form-control {
            border-radius: 8px;
            border: 1px solid #d6d8db;
        }
        .form-check-input {
            border-radius: 50%;
        }
        .btn-sm {
            padding: 8px 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-container">
        <h2 class="text-center mb-4">Enter Information for Prediction</h2>
        <form method="post" action="/predict">
            <!-- Personal Information -->
            <div>
                <h3 class="mb-3">Personal Details</h3>
                <div class="row">
                    <div class="col-md-6">
                        <label for="age" class="form-label">Age</label>
                        <input type="number" class="form-control" id="age" name="age" required min="18">
                    </div>
                    <div class="col-md-6">
                        <label for="job" class="form-label">Job</label>
                        <select class="form-select" id="job" name="job" required>
                            <option value="admin.">Administrator</option>
                            <option value="blue-collar">Skilled Worker</option>
                            <option value="entrepreneur">Business Owner</option>
                            <option value="housemaid">Housekeeper</option>
                            <option value="management">Manager</option>
                            <option value="retired">Retired</option>
                            <option value="self-employed">Self-Employed</option>
                            <option value="services">Service Worker</option>
                            <option value="student">Student</option>
                            <option value="technician">Technician</option>
                            <option value="unemployed">Unemployed</option>
                            <option value="unknown">Unknown</option>
                        </select>
                    </div>
                    <div class="col-md-6 mt-3">
                        <label for="marital" class="form-label">Marital Status</label>
                        <select class="form-select" id="marital" name="marital" required>
                            <option value="single">Single</option>
                            <option value="married">Married</option>
                            <option value="divorced">Divorced</option>
                        </select>
                    </div>
                    <div class="col-md-6 mt-3">
                        <label for="education" class="form-label">Education</label>
                        <select class="form-select" id="education" name="education" required>
                            <option value="basic.4y">Primary Education (4 years)</option>
                            <option value="basic.6y">Primary Education (6 years)</option>
                            <option value="basic.9y">Secondary Education (9 years)</option>
                            <option value="high.school">High School</option>
                            <option value="illiterate">Illiterate</option>
                            <option value="professional.course">Professional Course</option>
                            <option value="university.degree">University Degree</option>
                            <option value="unknown">Unknown</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Financial Information -->
            <div class="mt-4">
                <h3 class="mb-3">Financial Information</h3>
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label">Default</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="default" id="defaultYes" value="yes" required>
                            <label class="form-check-label" for="defaultYes">Yes</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="default" id="defaultNo" value="no" required>
                            <label class="form-check-label" for="defaultNo">No</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Housing</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="housing" id="housingYes" value="yes" required>
                            <label class="form-check-label" for="housingYes">Yes</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="housing" id="housingNo" value="no" required>
                            <label class="form-check-label" for="housingNo">No</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Loan</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="loan" id="loanYes" value="yes" required>
                            <label class="form-check-label" for="loanYes">Yes</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="loan" id="loanNo" value="no" required>
                            <label class="form-check-label" for="loanNo">No</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Optional Information -->
            <div class="optional-section mt-4">
                <h3><small>Optional Information</small></h3>
                <div class="row">
                    <div class="col-md-4">
                        <label for="campaign" class="form-label">Times Contacted</label>
                        <input type="number" value="0" class="form-control" id="campaign" name="campaign" min="0">
                    </div>
                    <div class="col-md-4">
                        <label for="pdays" class="form-label">Since Last Contact</label>
                        <input type="number" value="999" class="form-control" id="pdays" name="pdays" min="0">
                    </div>
                    <div class="col-md-4">
                        <label for="previous" class="form-label">Previous Contacts</label>
                        <input type="number" value="0" class="form-control" id="previous" name="previous" min="0">
                    </div>
                    <div class="col-md-4 mt-3">
                        <label for="poutcome" class="form-label">Previous Outcome</label>
                        <select class="form-select" id="poutcome" name="poutcome">
                            <option value="failure">Failure</option>
                            <option value="nonexistent" selected>Nonexistent</option>
                            <option value="success">Success</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="mt-4 text-center">
                <button type="submit" class="btn btn-primary fw-bold btn-sm">Predict</button>
            </div>
        </form>

        <!-- About Page Link -->
        <div class="text-right mt-4">
            <a href="/about" class="link-info">About</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
