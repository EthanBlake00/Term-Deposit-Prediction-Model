<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            height: 100vh;
            background-color: #f4f7fc;
            font-family: 'Arial', sans-serif;
        }
        .container {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form-container {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }
        h2 {
            font-weight: 600;
            color: #333;
        }
        .form-label {
            font-weight: 500;
            color: #555;
        }
        .btn-primary {
            background-color: #4caf50;
            border-color: #4caf50;
        }
        .btn-primary:hover {
            background-color: #45a049;
            border-color: #45a049;
        }
        .result-section {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .result-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }
        .result-value {
            font-size: 20px;
            color: #4caf50;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-container">
        <h2 class="text-center mb-4">Prediction Result</h2>

        <!-- Result Section -->
        <div class="result-section">
            <h3 class="result-title text-center">Prediction Outcome</h3>
            <p class="text-center">Based on the information provided, the model predicts the following outcome:</p>
            <hr>
            <div class="text-center">
                <h4 class="result-value">Client May Say: <span class="fw-bold">{{ prediction }}</span></h4>
            </div>
            <div class="text-center mt-4">
                <a href="/" class="btn btn-primary">Go Back</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
